<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drac</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#02060a">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--fg:#161a20;--chip:#fff;--bd:#d5dae1;--ac:#0a9db8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#e8ecf2;--chip:#1a1f27;--bd:#2c333d;--ac:#46ebff}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#e8ecf2;--chip:#1a1f27;--bd:#2c333d;--ac:#46ebff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:560px;padding:14px;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
.bezel{padding:10px;border-radius:32px;background:linear-gradient(145deg,#d9dde3,#8a919b);box-shadow:0 8px 24px rgba(0,0,0,.35)}
canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:24px;background:#02060a}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button,input{font:inherit;color:var(--fg)}
button{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--chip);cursor:pointer}
button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.say{display:flex;gap:8px;margin-top:14px}
.say input{flex:1;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--chip)}
small{display:block;margin-top:8px;opacity:.7}
details{margin-top:14px;border:1px solid var(--bd);border-radius:14px;padding:10px 12px;background:var(--chip)}
summary{cursor:pointer;font-weight:600}
label{display:block;margin-top:10px;font-size:13px;opacity:.85}
details input,select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
details input[type=range]{padding:0}
#st{margin-top:10px;min-height:20px;font-size:14px}
</style>
</head>
<body>
<div class="bezel"><canvas id="cv"></canvas></div>
<div class="say"><input id="txt" placeholder="Fale com o Drac"><button id="mic">🎤</button><button id="send">Enviar</button></div>
<div id="st">Abra as configurações e cole sua chave do Gemini.</div>
<details id="cfg"><summary>⚙️ Configurações</summary>
<label>Chave do Gemini (grátis, fica só neste celular)</label><input id="key" type="password" autocomplete="off" placeholder="Cole a chave aqui">
<label>Modelo</label><input id="model" value="gemini-3.5-flash-lite">
<label>Voz</label><select id="voice"></select>
<label>Grave/agudo: <span id="pv"></span></label><input id="pitch" type="range" min=".3" max="1.5" step=".05" value=".7">
<label>Velocidade: <span id="rv"></span></label><input id="rate" type="range" min=".6" max="1.4" step=".05" value=".95">
<label>Personalidade</label><textarea id="pers" rows="3"></textarea>
<div class="row"><button id="vt">🔊 Testar voz</button><button id="clr">Limpar conversa</button></div>
</details>
<details><summary>🎭 Testar emoções</summary><div class="row" id="ctl"></div><div class="row" id="chips"></div></details>
<script>
const W=320,H=240,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),off=document.createElement('canvas'),oc=off.getContext('2d');
let k=1;
function resize(){const d=Math.min(window.devicePixelRatio||1,3),w=cv.clientWidth;cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);k=cv.width/W;off.width=off.height=Math.round(220*k)}
const B={w:64,h:74,r:24,ox:0,oy:0,rot:0,top:0,slant:0,bot:0,sc:1},KE=Object.keys(B);
const CY=[70,235,255],PK=[255,100,150],RD=[255,95,70],BL=[100,175,255],PU=[175,135,255],GN=[110,255,200],GR=[205,210,225];
const mir=o=>{const r={};for(const q in o)r[q]=(q==='ox'||q==='rot')?-o[q]:o[q];return r};
const E={
neutro:{ic:'😐',L:{}},
feliz:{ic:'😊',L:{h:68,bot:.62,r:28,oy:2},blush:.5},
rindo:{ic:'😂',L:{h:66,bot:.7,r:28},blush:.9,fx:['bounce']},
amor:{ic:'😍',shape:'heart',col:PK,L:{w:70,h:64},blush:1,ga:.3},
animado:{ic:'🤩',L:{w:72,h:86,r:30,oy:-4},fx:['bounce','spark'],ga:1.4},
surpreso:{ic:'😮',L:{w:56,h:98,r:28,oy:-4},ga:.2},
assustado:{ic:'😨',L:{w:50,h:86,r:24},col:[200,235,255],fx:['shake','sweat'],ga:.2},
triste:{ic:'😢',L:{h:64,top:.3,slant:-1,oy:8},col:BL,ga:.4},
chorando:{ic:'😭',L:{h:56,top:.35,slant:-1.1,oy:10},col:BL,fx:['tear','shake'],jit:.35,ga:.2},
bravo:{ic:'😠',L:{h:62,top:.34,slant:1,r:18},col:RD,ga:.3},
furioso:{ic:'🤬',L:{h:56,top:.45,slant:1.5,r:12},col:[255,45,45],fx:['shake'],ga:.1},
desconfiado:{ic:'🤨',L:{h:40,top:.25,w:66},R:{h:80,top:.12,slant:.5},gaze:[-16,0]},
sonolento:{ic:'🥱',L:{h:60,top:.5,slant:-.25,oy:8},ga:.3,slow:1},
dormindo:{ic:'😴',L:{h:8,r:4,w:62,oy:10},col:[90,150,200],fx:['zzz'],noBlink:1,gaze:[0,0]},
cansado:{ic:'😩',L:{h:58,top:.4,slant:-.5,oy:10},col:[140,200,230],ga:.4},
confuso:{ic:'😕',L:{w:56,h:62,rot:-10},R:{w:68,h:82,rot:6},fx:['qmark'],ga:.6},
pensando:{ic:'🤔',L:{h:60,oy:-6,top:.08},R:{h:70,oy:-8},gaze:[22,-16],fx:['dots']},
piscadinha:{ic:'😉',L:{h:70},R:{h:8,r:4,w:66,oy:2},blush:.5,dur:1600},
entediado:{ic:'😒',L:{h:54,top:.46,oy:6},gaze:[-20,6],ga:.2,slow:1},
tonto:{ic:'😵‍💫',shape:'spiral',col:PU,L:{w:70,h:70},gaze:[0,0]},
morto:{ic:'😵',shape:'x',col:GR,L:{w:70,h:70},noBlink:1,gaze:[0,0]},
envergonhado:{ic:'😳',L:{h:52,w:58,oy:10,top:.12,bot:.12},blush:1,gaze:[-10,14],col:[255,170,200]},
ouvindo:{ic:'👂',L:{w:68,h:82,r:30},col:GN,ga:.2,gaze:[0,0]},
falando:{ic:'🗣️',L:{},talk:1},
focado:{ic:'🧐',L:{w:68,h:48,top:.28,slant:.3,r:18},ga:.1}
};
const z0=()=>({L:Object.fromEntries(KE.map(q=>[q,0])),R:Object.fromEntries(KE.map(q=>[q,0])),c:[0,0,0],gx:0,gy:0,blush:0});
const S=z0(),V=z0(),T=z0();
for(const s of['L','R'])for(const q of KE){S[s][q]=T[s][q]=B[q]}
S.c=[...CY];T.c=[...CY];
let em=E.neutro,cur='neutro',shape='eye',fx=new Set(),FA={},talkOn=false,be=null,nb=2,ng=1,t=0,durT=0,talkT=0;
const bl={L:0,R:0};
function newGaze(){if(em.gaze){T.gx=em.gaze[0];T.gy=em.gaze[1];return}const g=em.ga??1;if(Math.random()<.3){T.gx=0;T.gy=0}else{T.gx=(Math.random()*2-1)*20*g;T.gy=(Math.random()*2-1)*10*g}}
function setEmotion(n){const e=E[n];if(!e)return;em=e;cur=n;
T.L={...B,...e.L};T.R={...B,...(e.R||mir(e.L))};T.c=[...(e.col||CY)];T.blush=e.blush||0;
const sh=e.shape||'eye';const p=sh!==shape?.2:.88;shape=sh;S.L.sc=S.R.sc=p;
fx=new Set(e.fx||[]);talkOn=!!e.talk;newGaze();
document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.n===n));
clearTimeout(durT);if(e.dur)durT=setTimeout(()=>setEmotion('neutro'),e.dur)}
function blink(side,hold){be={t0:t,dur:hold?.7:(em.slow?.46:.19),L:!side||side==='L',R:!side||side==='R',hold}}
function doBlink(){if(!em.noBlink)blink()}
function lookAt(x,y){T.gx=x;T.gy=y}
function talk(on,ms){talkOn=on;clearTimeout(talkT);if(on&&ms)talkT=setTimeout(()=>{talkOn=!!em.talk},ms)}
function say(txt){let m=txt.match(/^\s*\[(\w+)\]\s*/),n=null;if(m&&E[m[1]]){n=m[1];txt=txt.slice(m[0].length)}
else{const R=[[/haha|kkk|rs\b/i,'rindo'],[/amo|adoro|fofo/i,'amor'],[/triste|sinto muito|infelizmente/i,'triste'],[/raiva|odeio|irritad/i,'bravo'],[/uau|nossa|sério/i,'surpreso'],[/\?/,'pensando'],[/feliz|ótimo|legal|oi\b|olá|!/i,'feliz']];
for(const[r,e]of R)if(r.test(txt)){n=e;break}n=n||'neutro'}
setEmotion(n);talk(true,Math.min(8000,Math.max(1200,txt.length*65)))}
function step(dt){for(const s of['L','R'])for(const q of KE){const kk=q==='sc'?260:170,z=q==='sc'?.45:.62;let v=V[s][q];v+=(kk*(T[s][q]-S[s][q])-2*Math.sqrt(kk)*z*v)*dt;S[s][q]+=v*dt;V[s][q]=v}
for(let i=0;i<3;i++){let v=V.c[i];v+=(90*(T.c[i]-S.c[i])-18.9*v)*dt;S.c[i]+=v*dt;V.c[i]=v}
for(const q of['gx','gy','blush']){let v=V[q];v+=(140*(T[q]-S[q])-2*Math.sqrt(140)*.75*v)*dt;S[q]+=v*dt;V[q]=v}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawEye(s,bob,shx,tm){const e=S[s],d=s==='L'?1:-1,b=bl[s],sc=Math.max(.02,e.sc);
const w=Math.max(4,e.w*sc*(1+.05*b)),h=Math.max(3,e.h*sc*(1-.93*b)*tm),r=Math.max(1,e.r);
const rgb=S.c.map(v=>Math.max(0,Math.min(255,Math.round(v)))).join(',');
oc.setTransform(k,0,0,k,0,0);oc.clearRect(0,0,220,220);oc.save();oc.translate(110,110);oc.globalCompositeOperation='source-over';oc.fillStyle=oc.strokeStyle='rgb('+rgb+')';
if(shape==='eye'){rr(oc,-w/2,-h/2,w,h,r);oc.fill();oc.globalCompositeOperation='destination-out';oc.fillStyle='#000';
if(e.top>.005){const y=x=>-h/2+e.top*h+e.slant*h*.5*(d*x)/(w/2);oc.beginPath();oc.moveTo(-w,-h);oc.lineTo(w,-h);oc.lineTo(w,y(w));oc.lineTo(-w,y(-w));oc.closePath();oc.fill()}
if(e.bot>.005){const R=w*.62;oc.beginPath();oc.arc(0,h/2-e.bot*h+R,R,0,7);oc.fill()}}
else if(shape==='heart'){const q=Math.min(w,h)*.55*(1+.07*Math.sin(t*7));oc.beginPath();oc.moveTo(0,q*.85);oc.bezierCurveTo(-q*1.35,q*.05,-q*.85,-q*.95,0,-q*.38);oc.bezierCurveTo(q*.85,-q*.95,q*1.35,q*.05,0,q*.85);oc.fill()}
else if(shape==='x'){oc.lineWidth=12;oc.lineCap='round';const a=w*.36;oc.beginPath();oc.moveTo(-a,-a);oc.lineTo(a,a);oc.moveTo(a,-a);oc.lineTo(-a,a);oc.stroke()}
else{oc.lineWidth=7;oc.lineCap='round';oc.beginPath();const R=Math.min(w,h)/2;for(let a=0;a<14;a+=.2){const q=R*a/14,n=a-t*5*d;oc.lineTo(Math.cos(n)*q,Math.sin(n)*q)}oc.stroke()}
oc.restore();
ctx.save();ctx.translate((s==='L'?104:216)+e.ox+S.gx+shx,118+e.oy+S.gy+bob);ctx.rotate(e.rot*Math.PI/180);ctx.shadowColor='rgba('+rgb+',.85)';ctx.shadowBlur=26*k;ctx.drawImage(off,-110,-110,220,220);ctx.restore()}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.28:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fill()}
function draw(){
for(const n of['bounce','shake','tear','zzz','sweat','dots','qmark','spark']){FA[n]=(FA[n]||0)+((fx.has(n)?1:0)-(FA[n]||0))*.12}
let p=be?(t-be.t0)/be.dur:2;if(p>=1){be=null;bl.L=bl.R=0}else{const q=be.hold?(p<.2?p/.2:p>.75?(1-p)/.25:1):(p<.4?p/.4:1-(p-.4)/.6);bl.L=be.L?q:0;bl.R=be.R?q:0}
const bob=-Math.abs(Math.sin(t*8))*7*FA.bounce+Math.sin(t*1.6)*1.5,shx=Math.sin(t*55)*2.4*FA.shake*(em.jit??1),tm=1+(talkOn?.06*Math.sin(t*13)+.04*Math.sin(t*5.3):0);
ctx.setTransform(k,0,0,k,0,0);ctx.fillStyle='#02060a';ctx.fillRect(0,0,W,H);
drawEye('L',bob,shx,tm);drawEye('R',bob,shx,tm);
ctx.setTransform(k,0,0,k,0,0);
if(FA.tear>.02)for(const[x,o]of[[92,0],[228,.35]]){const ph=(t*.7+o)%1;ctx.fillStyle='rgba(140,205,255,'+FA.tear*(1-ph)+')';ctx.beginPath();ctx.ellipse(x,166+ph*55,4,6,0,0,7);ctx.fill()}
if(FA.zzz>.02)for(let i=0;i<3;i++){const ph=(t*.35+i/3)%1;ctx.fillStyle='rgba(160,215,255,'+FA.zzz*Math.sin(Math.PI*ph)+')';ctx.font='bold '+(14+ph*14)+'px sans-serif';ctx.fillText('Z',235+ph*30,84-ph*50)}
if(FA.sweat>.02){ctx.fillStyle='rgba(120,190,255,'+FA.sweat+')';ctx.beginPath();ctx.ellipse(262,60+((t*.5)%1)*20,5,7,0,0,7);ctx.fill()}
if(FA.dots>.02){for(let i=0;i<3;i++){ctx.fillStyle='rgba(70,235,255,'+FA.dots+')';ctx.beginPath();ctx.arc(232+i*16,56,4+3*Math.max(0,Math.sin(t*5-i*1.1)),0,7);ctx.fill()}}
if(FA.qmark>.02){ctx.fillStyle='rgba(70,235,255,'+FA.qmark+')';ctx.font='bold 38px sans-serif';ctx.fillText('?',246,64+Math.sin(t*3)*3)}
if(FA.spark>.02){[[40,50],[280,60],[60,200],[270,196],[160,26]].forEach(([x,y],i)=>{ctx.fillStyle='rgba(255,225,110,'+FA.spark*(.3+.7*Math.max(0,Math.sin(t*4+i*1.7)))+')';star(x,y,5+6*Math.max(0,Math.sin(t*4+i*1.7)))})}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
nb-=dt;if(nb<=0){doBlink();nb=Math.random()<.2?.35:2+Math.random()*3.5}
ng-=dt;if(ng<=0){newGaze();ng=1.4+Math.random()*2.8}
const n=Math.ceil(dt/(1/120));for(let i=0;i<n;i++)step(dt/n);draw();requestAnimationFrame(frame)}
const chips=document.getElementById('chips'),ctl=document.getElementById('ctl');
Object.keys(E).forEach(n=>{const b=document.createElement('button');b.dataset.n=n;b.textContent=E[n].ic+' '+n[0].toUpperCase()+n.slice(1);b.onclick=()=>{stopAuto();setEmotion(n)};chips.appendChild(b)});
let auto=null;const ab=document.createElement('button');
function stopAuto(){if(auto){clearInterval(auto);auto=null;ab.classList.remove('on')}}
ab.textContent='▶ Auto';ab.onclick=()=>{if(auto)return stopAuto();const ks=Object.keys(E);let i=0;auto=setInterval(()=>setEmotion(ks[++i%ks.length]),2800);ab.classList.add('on')};
const mk=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;ctl.appendChild(b)};
ctl.appendChild(ab);mk('Piscar',()=>blink());mk('Olhar em volta',()=>newGaze());
const $=i=>document.getElementById(i),gs=k=>{try{return localStorage.getItem('drac_'+k)}catch(e){return null}},ss=(k,v)=>{try{localStorage.setItem('drac_'+k,v)}catch(e){}};
const DEF='Você é o Drac, um robozinho de mesa simpático, curioso e levemente sarcástico. Fala de forma natural e curta.';
let hist=[];
const st=m=>{$('st').textContent=m};
['key','model','pers','pitch','rate'].forEach(i=>{const v=gs(i);if(v!==null)$(i).value=v;$(i).addEventListener('input',()=>{ss(i,$(i).value);sh()})});
if(!$('pers').value)$('pers').value=DEF;
function sh(){$('pv').textContent=$('pitch').value;$('rv').textContent=$('rate').value}sh();
function loadVoices(){const vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)),sel=$('voice');sel.innerHTML='';vs.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});const sv=gs('voice');if(sv)sel.value=sv}
$('voice').onchange=()=>ss('voice',$('voice').value);
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(txt){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';const v=speechSynthesis.getVoices().find(x=>x.name===$('voice').value);if(v)u.voice=v;u.pitch=+$('pitch').value;u.rate=+$('rate').value;u.onstart=()=>talk(true,Math.max(2500,txt.length*95));u.onend=u.onerror=()=>talk(false);speechSynthesis.speak(u)}
const EM=Object.keys(E).join(', ');
async function ask(txt){
if(!txt.trim())return;const key=$('key').value.trim();if(!key){st('Cole a chave do Gemini em Configurações.');$('cfg').open=true;return}
stopAuto();hist.push({role:'user',parts:[{text:txt}]});hist=hist.slice(-12);setEmotion('pensando');st('Pensando...');
const sys=$('pers').value+' Responda sempre em português do Brasil, em no máximo 2 frases curtas, sem emojis e sem markdown. Comece SEMPRE com uma tag de emoção entre colchetes, escolhida entre: '+EM+'. Exemplo: [feliz] Oi, tudo bem?';
try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent($('model').value.trim())+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:hist,generationConfig:{maxOutputTokens:200}})});
const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
let out=j.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
hist.push({role:'model',parts:[{text:out}]});
const m=out.match(/^\s*\[(\w+)\]\s*/);let n='neutro';if(m){if(E[m[1]])n=m[1];out=out.slice(m[0].length)}
setEmotion(n);st(out);speak(out)}
catch(e){hist.pop();setEmotion('triste');st('Erro: '+e.message)}}
$('send').onclick=()=>{const t=$('txt').value;$('txt').value='';ask(t)};
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
$('vt').onclick=()=>speak('Olá, eu sou o Drac. Essa é a minha voz.');
$('clr').onclick=()=>{hist=[];st('Conversa limpa.')};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{if(!SR){st('Sem reconhecimento de voz aqui. Use o Chrome.');return}
if('speechSynthesis' in window)speechSynthesis.cancel();const rc=new SR();rc.lang='pt-BR';rc.interimResults=false;
rc.onstart=()=>{setEmotion('ouvindo');st('Ouvindo...')};
rc.onresult=e=>{const t=e.results[0][0].transcript;st('Você: '+t);ask(t)};
rc.onerror=e=>{setEmotion('neutro');st('Microfone: '+e.error)};rc.start()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('message',e=>{const d=e.data;if(d&&d.emotion)setEmotion(d.emotion);if(d&&d.say)say(d.say)});
window.drac={setEmotion,say,blink,wink:s=>blink(s||'R',true),lookAt,talk,emotions:Object.keys(E)};
window.addEventListener('resize',resize);resize();setEmotion('neutro');requestAnimationFrame(frame);
</script>
</body>
</html>
